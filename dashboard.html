<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Sonhos - App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* Ocultar scrollbar, mas permitir scroll nativo horizontal/vertical */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        * { -webkit-tap-highlight-color: transparent; }

        /* Animações nativas */
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .aba-ativa { display: block; animation: slideInUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .aba-oculta { display: none; }

        /* Modal "Bottom Sheet" nativo */
        .bottom-sheet-up { transform: translateY(0%); }
        .bottom-sheet-down { transform: translateY(100%); }

        /* Efeito de Vidro */
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-[#F4F4F9] min-h-screen font-sans text-slate-800 pb-28 md:pb-0 overflow-x-hidden selection:bg-indigo-100 selection:text-indigo-900">

    <!-- DESKTOP NAV -->
    <nav class="hidden md:flex glass-nav shadow-sm border-b border-slate-200/50 px-8 py-4 justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-md"><i class="ph-bold ph-planet text-xl"></i></div>
            <h1 class="text-xl font-extrabold tracking-tight">Gestor<span class="text-indigo-600">Sonhos</span></h1>
        </div>
        
        <div class="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 gap-1">
            <button onclick="mudarAba('sonhos', this)" class="desktop-tab bg-white text-indigo-600 shadow-sm flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold transition-all"><i class="ph-fill ph-plus-circle"></i> Criar</button>
            <button onclick="mudarAba('saldos', this)" class="desktop-tab text-slate-500 hover:text-slate-800 flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold transition-all"><i class="ph-fill ph-wallet"></i> Saldos</button>
            <button onclick="mudarAba('previsoes', this)" class="desktop-tab text-slate-500 hover:text-slate-800 flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold transition-all"><i class="ph-fill ph-trend-up"></i> Previsões</button>
            <button onclick="mudarAba('perfil', this)" class="desktop-tab text-slate-500 hover:text-slate-800 flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold transition-all"><i class="ph-fill ph-user-circle"></i> Perfil</button>
        </div>

        <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span id="boas-vindas-desktop" class="text-xs font-bold text-slate-600"></span>
        </div>
    </nav>

    <!-- MOBILE NAV -->
    <nav class="md:hidden fixed bottom-5 left-4 right-4 glass-nav rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-white/60 z-40 p-1.5">
        <ul class="flex justify-between items-center" id="mobile-nav">
            <li class="nav-item flex-1" onclick="mudarAba('sonhos', this)">
                <button class="w-full flex flex-col items-center justify-center gap-0.5 py-2 rounded-2xl bg-indigo-50/80 transition-all">
                    <i class="ph-fill ph-plus-circle text-[24px] nav-icon text-indigo-600"></i>
                    <span class="text-[10px] font-extrabold text-indigo-700">Criar</span>
                </button>
            </li>
            <li class="nav-item flex-1" onclick="mudarAba('saldos', this)">
                <button class="w-full flex flex-col items-center justify-center gap-0.5 py-2 rounded-2xl bg-transparent transition-all">
                    <i class="ph-fill ph-wallet text-[24px] nav-icon text-slate-400"></i>
                    <span class="text-[10px] font-bold text-slate-500">Saldos</span>
                </button>
            </li>
            <li class="nav-item flex-1" onclick="mudarAba('previsoes', this)">
                <button class="w-full flex flex-col items-center justify-center gap-0.5 py-2 rounded-2xl bg-transparent transition-all">
                    <i class="ph-fill ph-trend-up text-[24px] nav-icon text-slate-400"></i>
                    <span class="text-[10px] font-bold text-slate-500">Previsões</span>
                </button>
            </li>
            <li class="nav-item flex-1" onclick="mudarAba('perfil', this)">
                <button class="w-full flex flex-col items-center justify-center gap-0.5 py-2 rounded-2xl bg-transparent transition-all">
                    <i class="ph-fill ph-user-circle text-[24px] nav-icon text-slate-400"></i>
                    <span class="text-[10px] font-bold text-slate-500">Perfil</span>
                </button>

        </ul>

    <main class="max-w-3xl mx-auto" id="conteudo-principal">
        
        <!-- ========================================== -->
        <!-- ABA 1: CRIAR SONHOS (Formulário Nativo) -->
        <!-- ========================================== -->
        <section id="aba-sonhos" class="aba-ativa p-4 md:p-8">
            <div class="mb-4">
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Registar Plano</h2>
                <p class="text-sm font-medium text-slate-500">O que vamos conquistar hoje?</p>
            </div>

            <form id="form-sonho" class="space-y-6">
                
                <!-- Nome (Direto e Limpo) -->
                <div class="bg-white rounded-[20px] p-1 shadow-sm border border-slate-100">
                    <input type="text" id="input-nome" required placeholder="Ex: Macbook Pro M3" class="w-full px-5 py-4 bg-transparent text-xl font-bold text-slate-800 placeholder-slate-300 focus:outline-none">
                </div>

                <!-- Valores: Unitário e Quantidade -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                        <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1">Preço Unitário</label>
                        <div class="flex items-center">
                            <span class="text-slate-400 font-bold mr-1">R$</span>
                            <input type="number" id="input-preco-unit" min="0" step="0.01" required placeholder="0.00" class="w-full bg-transparent text-lg font-bold text-slate-800 focus:outline-none">
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                        <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1">Quantidade</label>
                        <div class="flex items-center">
                            <input type="number" id="input-quantidade" min="1" value="1" required class="w-full bg-transparent text-lg font-bold text-slate-800 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- Total Dinâmico -->
                <div class="flex justify-between items-center bg-indigo-50 p-5 rounded-2xl border border-indigo-100">
                    <div>
                        <p class="text-[11px] font-extrabold text-indigo-400 uppercase tracking-wider">Custo Total Previsto</p>
                        <p class="text-2xl font-black text-indigo-700" id="display-total">R$ 0.00</p>
                    </div>
                    <div class="text-right">
                        <label class="block text-[10px] font-bold text-indigo-400 uppercase tracking-wider mb-1">Valor Guardado</label>
                        <div class="flex items-center justify-end bg-white rounded-lg px-2 py-1 border border-indigo-200 w-24">
                            <span class="text-slate-400 text-xs font-bold mr-1">R$</span>
                            <input type="number" id="input-guardado" min="0" step="0.01" value="0" class="w-full bg-transparent text-sm font-bold text-slate-700 focus:outline-none text-right">
                        </div>
                    </div>
                </div>

                <!-- Pílulas (Chips) de Seleção Rápida -->
                <!-- Categoria -->
                <div>
                    <label class="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-2 ml-1">Categoria</label>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="chips-categoria">
                        <!-- Gerado via JS para não poluir -->
                    </div>
                    <input type="hidden" id="val-categoria" value="Tecnologia">
                </div>

                <!-- Consigo Fazer (Viabilidade) -->
                <div>
                    <label class="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-2 ml-1">Execução</label>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="chips-viabilidade"></div>
                    <input type="hidden" id="val-viabilidade" value="Fácil e rápido">
                </div>

                <!-- Prioridade e Complexidade -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-2 ml-1">Prioridade</label>
                        <div class="flex flex-col gap-2" id="chips-prioridade"></div>
                        <input type="hidden" id="val-prioridade" value="Média">
                    </div>
                    <div>
                        <label class="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-2 ml-1">Estrutura</label>
                        <div class="flex flex-col gap-2" id="chips-complexidade"></div>
                        <input type="hidden" id="val-complexidade" value="Simples">
                    </div>
                </div>

                <!-- Itens Compostos (Abre só se selecionado Composto) -->
                <div id="div-composto" class="hidden bg-slate-800 p-4 rounded-2xl shadow-lg text-white">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Sub-itens</label>
                        <button type="button" id="btn-add-parte" class="text-indigo-400 text-sm font-bold"><i class="ph-bold ph-plus"></i> Add Item</button>
                    </div>
                    <div id="lista-partes" class="space-y-2"></div>
                </div>

                <div id="msg-form" class="hidden text-sm font-bold text-center py-3 rounded-xl"></div>

                <button type="submit" id="btn-guardar" class="w-full bg-slate-900 active:scale-95 text-white font-bold py-4 rounded-2xl shadow-lg shadow-slate-300 transition-all flex justify-center items-center gap-2">
                    <i class="ph-bold ph-check-circle text-xl"></i> Gravar Plano
                </button>
            </form>
        </section>

        <!-- ========================================== -->
        <!-- ABA 2: SALDOS / LISTA DE PLANOS -->
        <!-- ========================================== -->
        <section id="aba-saldos" class="aba-oculta p-4 md:p-8">
            
            <!-- Header Resumo Geral -->
            <div class="bg-gradient-to-br from-indigo-600 to-blue-600 rounded-[2rem] p-6 text-white shadow-xl shadow-indigo-200 mb-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-48 h-48 bg-white/10 rounded-full blur-2xl -mt-10 -mr-10"></div>
                
                <p class="text-indigo-100 text-sm font-bold uppercase tracking-widest mb-1">Capital Necessário</p>
                <h2 class="text-4xl font-black tracking-tight flex items-baseline gap-1" id="saldos-total-geral">
                    <span class="text-xl">R$</span>0,00
                </h2>
                
                <div class="mt-6 flex gap-3">
                    <div class="bg-black/20 backdrop-blur-sm rounded-xl px-4 py-2 flex-1">
                        <p class="text-[10px] font-bold text-indigo-200 uppercase">Guardado</p>
                        <p class="font-bold" id="saldos-guardado">R$ 0,00</p>
                    </div>
                    <div class="bg-black/20 backdrop-blur-sm rounded-xl px-4 py-2 flex-1">
                        <p class="text-[10px] font-bold text-indigo-200 uppercase">Falta</p>
                        <p class="font-bold" id="saldos-falta">R$ 0,00</p>
                    </div>
                </div>
            </div>

            <!-- Lista de Sonhos -->
            <div>
                <div class="flex justify-between items-center mb-4 px-1">
                    <h3 class="text-lg font-extrabold text-slate-800">Os Teus Planos</h3>
                    <button onclick="carregarSonhos()" class="text-slate-400 hover:text-indigo-600"><i class="ph-bold ph-arrows-clockwise text-xl"></i></button>
                </div>
                
                <!-- Container da Lista -->
                <div id="lista-sonhos-container" class="space-y-3">
                    <p class="text-center text-slate-400 text-sm py-8">A carregar os teus sonhos...</p>
                </div>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- ABA: PREVISÕES & PERFIL (Mantidas Compactas) -->
        <!-- ========================================== -->
        <section id="aba-previsoes" class="aba-oculta p-4 md:p-8">
            <h2 class="text-2xl font-extrabold text-slate-900 mb-4">Previsões</h2>
            <div class="bg-white p-8 rounded-3xl border border-slate-100 text-center flex flex-col items-center">
                <div class="w-16 h-16 bg-purple-50 text-purple-500 rounded-full flex items-center justify-center text-3xl mb-4"><i class="ph-fill ph-trend-up"></i></div>
                <h3 class="text-lg font-bold text-slate-800">Em Breve</h3>
                <p class="text-sm text-slate-500">Gráficos preditivos com o tempo estimado.</p>
            </div>
        </section>

        <section id="aba-perfil" class="aba-oculta p-4 md:p-8">
            <h2 class="text-2xl font-extrabold text-slate-900 mb-4">Perfil</h2>
            <div class="bg-white p-6 rounded-3xl border border-slate-100 text-center flex flex-col items-center">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 text-4xl mb-3"><i class="ph-fill ph-user"></i></div>
                <h3 class="font-bold text-slate-800" id="perfil-email">A carregar...</h3>
                <button id="btn-sair" class="mt-6 w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl flex items-center justify-center gap-2"><i class="ph-bold ph-sign-out"></i> Sair</button>
            </div>
        </section>

    </main>

    <!-- ========================================== -->
    <!-- BOTTOM SHEET MODAL (Detalhes do Plano) -->
    <!-- ========================================== -->
    <div id="modal-detalhes" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity opacity-0" id="modal-backdrop" onclick="fecharModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2rem] px-6 pt-2 pb-8 transform transition-transform duration-300 bottom-sheet-down max-h-[85vh] overflow-y-auto" id="modal-content">
            <!-- Puxador -->
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
            
            <div id="modal-body">
                <!-- Conteúdo Injetado via JS -->
            </div>
        </div>
    </div>


    <script>
        // CONFIGURAÇÕES SUPABASE
        const URL_DO_TEU_SUPABASE = 'https://lqfwpfaqcnfsybxchmtg.supabase.co';
        const CHAVE_DO_TEU_SUPABASE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxZndwZmFxY25mc3lieGNobXRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2ODk5MjIsImV4cCI6MjA5MDI2NTkyMn0.XMO-YQIzULWK2yMFoqdBVP-wYPA7P84sp4QnsuS0hks';
        const clienteSupabase = window.supabase.createClient(URL_DO_TEU_SUPABASE, CHAVE_DO_TEU_SUPABASE);
        
        let idUtilizadorAtual = null;

        // Função de segurança para redirecionamento suave em ambiente de pré-visualização (Canvas)
        function irParaLogin() {
            try {
                window.location.href = 'index.html';
            } catch (erro) {
                document.body.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-[#F4F4F9] p-6">
                        <div class="bg-white p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 text-center max-w-sm w-full border border-slate-100">
                            <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                                <i class="ph-fill ph-lock-key"></i>
                            </div>
                            <h2 class="text-xl font-black text-slate-800 mb-2">Acesso Necessário</h2>
                            <p class="text-sm font-medium text-slate-500 mb-6">Não tens sessão iniciada ou terminaste a sessão.</p>
                            <p class="text-xs font-bold text-indigo-600 bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                                Por favor, abre o ficheiro <strong>index.html</strong> no teu computador para fazeres o login.
                            </p>
                        </div>
                    </div>
                `;
            }
        }

        // FORMATADOR DE MOEDA
        const formatarMoeda = (valor) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);

        // ========================================================
        // 1. CHIPS (Pílulas Nativas) - Renderização e Lógica
        // ========================================================
        const opcoesChips = {
            categoria: [
                { val: 'Tecnologia', icon: '💻', text: 'Tec' },
                { val: 'Viagem', icon: '✈️', text: 'Viagem' },
                { val: 'Casa', icon: '🏠', text: 'Casa' },
                { val: 'Veículo', icon: '🚗', text: 'Veículo' },
                { val: 'Estudo', icon: '📚', text: 'Estudo' },
                { val: 'Outros', icon: '📌', text: 'Outro' }
            ],
            viabilidade: [
                { val: 'Fácil e rápido', icon: '⚡', text: 'Imediato' },
                { val: 'Requer planeamento', icon: '📅', text: 'Longo Prazo' },
                { val: 'Nao', icon: '🤝', text: 'Contratar' }
            ],
            prioridade: [
                { val: 'Alta', icon: '🔴', text: 'Urgente' },
                { val: 'Média', icon: '🟡', text: 'Normal' },
                { val: 'Baixa', icon: '🟢', text: 'Baixa' }
            ],
            complexidade: [
                { val: 'Simples', icon: '🧩', text: 'Único' },
                { val: 'Composto', icon: '🏗️', text: 'Por Partes' }
            ]
        };

        function renderizarChips(grupo, idContainer, idInputHidden) {
            const container = document.getElementById(idContainer);
            container.innerHTML = '';
            
            opcoesChips[grupo].forEach((opt, index) => {
                const isSelected = index === 0; // O primeiro vem selecionado
                if(isSelected) document.getElementById(idInputHidden).value = opt.val;

                const btn = document.createElement('button');
                btn.type = 'button';
                // Classes base para app nativa
                btn.className = `whitespace-nowrap px-4 py-2.5 rounded-[14px] text-xs font-bold transition-all border shrink-0 flex items-center gap-1.5 ${
                    isSelected ? 'bg-slate-800 text-white border-slate-800 shadow-md' : 'bg-white text-slate-500 border-slate-200'
                }`;
                btn.innerHTML = `<span>${opt.icon}</span> ${opt.text}`;
                
                btn.onclick = () => {
                    // Remover ativo de todos os irmãos
                    Array.from(container.children).forEach(child => {
                        child.className = 'whitespace-nowrap px-4 py-2.5 rounded-[14px] text-xs font-bold transition-all border shrink-0 flex items-center gap-1.5 bg-white text-slate-500 border-slate-200';
                    });
                    // Ativar este
                    btn.className = 'whitespace-nowrap px-4 py-2.5 rounded-[14px] text-xs font-bold transition-all border shrink-0 flex items-center gap-1.5 bg-slate-800 text-white border-slate-800 shadow-md';
                    document.getElementById(idInputHidden).value = opt.val;

                    // Gatilhos extras baseados na escolha
                    if(grupo === 'complexidade') verificarComplexidade();
                };
                container.appendChild(btn);
            });
        }

        renderizarChips('categoria', 'chips-categoria', 'val-categoria');
        renderizarChips('viabilidade', 'chips-viabilidade', 'val-viabilidade');
        renderizarChips('prioridade', 'chips-prioridade', 'val-prioridade');
        renderizarChips('complexidade', 'chips-complexidade', 'val-complexidade');


        // ========================================================
        // 2. CÁLCULOS DINÂMICOS DO FORMULÁRIO
        // ========================================================
        const inputPreco = document.getElementById('input-preco-unit');
        const inputQtd = document.getElementById('input-quantidade');
        const displayTotal = document.getElementById('display-total');
        const complexidadeHidd = document.getElementById('val-complexidade');
        
        function calcularTotal() {
            if (complexidadeHidd.value === 'Composto') {
                let totalPartes = 0;
                document.querySelectorAll('.custo-parte').forEach(inp => totalPartes += (parseFloat(inp.value)||0));
                displayTotal.innerText = formatarMoeda(totalPartes);
                return totalPartes;
            } else {
                const preco = parseFloat(inputPreco.value) || 0;
                const qtd = parseInt(inputQtd.value) || 1;
                const total = preco * qtd;
                displayTotal.innerText = formatarMoeda(total);
                return total;
            }
        }

        inputPreco.addEventListener('input', calcularTotal);
        inputQtd.addEventListener('input', calcularTotal);

        function verificarComplexidade() {
            const isComposto = complexidadeHidd.value === 'Composto';
            const divComposto = document.getElementById('div-composto');
            
            if (isComposto) {
                divComposto.classList.remove('hidden');
                inputPreco.parentElement.parentElement.classList.add('opacity-40', 'pointer-events-none');
                inputPreco.value = '';
                if(document.getElementById('lista-partes').children.length === 0) adicionarParte();
            } else {
                divComposto.classList.add('hidden');
                inputPreco.parentElement.parentElement.classList.remove('opacity-40', 'pointer-events-none');
                document.getElementById('lista-partes').innerHTML = '';
            }
            calcularTotal();
        }

        document.getElementById('btn-add-parte').onclick = adicionarParte;
        function adicionarParte() {
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center bg-slate-700 p-1.5 rounded-xl';
            div.innerHTML = `
                <input type="text" placeholder="Item" required class="nome-parte flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-slate-800 text-white outline-none">
                <input type="number" placeholder="0.00" min="0" step="0.01" required class="custo-parte w-20 px-2 py-2 text-xs font-bold rounded-lg bg-slate-800 text-white outline-none text-center">
                <button type="button" class="text-red-400 p-2 remover-parte"><i class="ph-bold ph-x"></i></button>
            `;
            document.getElementById('lista-partes').appendChild(div);
            div.querySelector('.custo-parte').addEventListener('input', calcularTotal);
            div.querySelector('.remover-parte').onclick = () => { div.remove(); calcularTotal(); };
        }


        // ========================================================
        // 3. NAVEGAÇÃO
        // ========================================================
        const abas = ['sonhos', 'saldos', 'previsoes', 'perfil'];
        function mudarAba(idAba, botaoClicado) {
            abas.forEach(aba => {
                const el = document.getElementById(`aba-${aba}`);
                if(el) { el.classList.remove('aba-ativa'); el.classList.add('aba-oculta'); }
            });
            document.getElementById(`aba-${idAba}`).classList.remove('aba-oculta');
            document.getElementById(`aba-${idAba}`).classList.add('aba-ativa');

            // Mobile style
            if (botaoClicado && botaoClicado.closest('#mobile-nav')) {
                document.querySelectorAll('#mobile-nav button').forEach(btn => {
                    btn.classList.remove('bg-indigo-50/80');
                    btn.classList.add('bg-transparent');
                    btn.querySelector('.nav-icon').classList.replace('text-indigo-600', 'text-slate-400');
                    btn.querySelector('span').classList.replace('text-indigo-700', 'text-slate-500');
                    btn.querySelector('span').classList.replace('font-extrabold', 'font-bold');
                });
                const btn = botaoClicado.querySelector('button');
                btn.classList.replace('bg-transparent', 'bg-indigo-50/80');
                btn.querySelector('.nav-icon').classList.replace('text-slate-400', 'text-indigo-600');
                btn.querySelector('span').classList.replace('text-slate-500', 'text-indigo-700');
                btn.querySelector('span').classList.replace('font-bold', 'font-extrabold');
            }
            
            // Desktop style
            if (botaoClicado && botaoClicado.closest('.desktop-tab')) {
                document.querySelectorAll('.desktop-tab').forEach(tab => {
                    tab.classList.replace('bg-white', 'bg-transparent');
                    tab.classList.replace('text-indigo-600', 'text-slate-500');
                    tab.classList.remove('shadow-sm');
                });
                botaoClicado.classList.replace('bg-transparent', 'bg-white');
                botaoClicado.classList.replace('text-slate-500', 'text-indigo-600');
                botaoClicado.classList.add('shadow-sm');
            }

            if(idAba === 'saldos') carregarSonhos();
        }

        // ========================================================
        // 4. SUPABASE: GUARDAR E LER
        // ========================================================
        window.onload = async () => {
            const { data: { session } } = await clienteSupabase.auth.getSession();
            if (!session) {
                irParaLogin();
                return;
            }
            
            idUtilizadorAtual = session.user.id;
            const email = session.user.email;
            document.getElementById('boas-vindas-desktop').innerText = `Olá, ${email.split('@')[0]}`;
            document.getElementById('perfil-email').innerText = email;
        };

        document.getElementById('btn-sair').onclick = async () => {
            await clienteSupabase.auth.signOut();
            irParaLogin();
        };

        // Guardar Sonho
        const formSonho = document.getElementById('form-sonho');
        formSonho.onsubmit = async (e) => {
            e.preventDefault();
            if(!idUtilizadorAtual) return;

            const btn = document.getElementById('btn-guardar');
            const msg = document.getElementById('msg-form');
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin"></i> Gravando...`;
            
            let itensComp = null;
            if(complexidadeHidd.value === 'Composto'){
                itensComp = [];
                document.querySelectorAll('#lista-partes > div').forEach(l => {
                    itensComp.push({ nome: l.querySelector('.nome-parte').value, custo: parseFloat(l.querySelector('.custo-parte').value), comprado: false });
                });
            }

            const custoCalc = calcularTotal();

            const dados = {
                user_id: idUtilizadorAtual,
                nome: document.getElementById('input-nome').value,
                quantidade: parseInt(inputQtd.value) || 1,
                custo: custoCalc,
                valor_guardado: parseFloat(document.getElementById('input-guardado').value) || 0,
                categoria: document.getElementById('val-categoria').value,
                viabilidade: document.getElementById('val-viabilidade').value,
                prioridade: document.getElementById('val-prioridade').value,
                complexidade: document.getElementById('val-complexidade').value,
                itens_compostos: itensComp
            };

            const { error } = await clienteSupabase.from('sonhos').insert([dados]);

            if (error) {
                msg.innerHTML = `⚠️ ${error.message}`;
                msg.className = "text-xs font-bold text-red-600 bg-red-50 block py-2 px-3 rounded-lg border border-red-100";
            } else {
                msg.innerHTML = `🎉 Plano registado! Verifica na aba Saldos.`;
                msg.className = "text-xs font-bold text-green-600 bg-green-50 block py-2 px-3 rounded-lg border border-green-100";
                formSonho.reset();
                renderizarChips('categoria', 'chips-categoria', 'val-categoria'); // reset chips
                renderizarChips('viabilidade', 'chips-viabilidade', 'val-viabilidade');
                renderizarChips('prioridade', 'chips-prioridade', 'val-prioridade');
                renderizarChips('complexidade', 'chips-complexidade', 'val-complexidade');
                calcularTotal();
            }

            btn.innerHTML = `<i class="ph-bold ph-check-circle text-xl"></i> Gravar Plano`;
            setTimeout(() => { msg.classList.add('hidden'); }, 3000);
        };

        // Carregar Sonhos (Aba Saldos)
        async function carregarSonhos() {
            if(!idUtilizadorAtual) return;
            const container = document.getElementById('lista-sonhos-container');
            container.innerHTML = '<p class="text-center text-slate-400 text-sm py-4"><i class="ph-bold ph-spinner animate-spin"></i> Atualizando cofre...</p>';
            
            const { data, error } = await clienteSupabase.from('sonhos').select('*').eq('user_id', idUtilizadorAtual).order('criado_em', { ascending: false });
            
            if(error) {
                container.innerHTML = `<p class="text-red-500 text-center text-sm py-4">Erro ao carregar dados.</p>`;
                return;
            }

            let totalGeral = 0;
            let totalGuardado = 0;

            container.innerHTML = '';
            if(data.length === 0) {
                container.innerHTML = '<div class="bg-white rounded-2xl p-6 text-center border border-slate-100"><p class="text-slate-400 text-sm font-bold">Ainda não tens planos criados.</p></div>';
            } else {
                data.forEach(sonho => {
                    totalGeral += parseFloat(sonho.custo || 0);
                    totalGuardado += parseFloat(sonho.valor_guardado || 0);

                    // Cores por prioridade
                    let corPrio = 'bg-slate-100 text-slate-500';
                    if(sonho.prioridade === 'Alta') corPrio = 'bg-red-50 text-red-600 border border-red-100';
                    if(sonho.prioridade === 'Média') corPrio = 'bg-amber-50 text-amber-600 border border-amber-100';
                    
                    // Estrutura do Card
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center active:scale-[0.98] transition-transform cursor-pointer";
                    card.onclick = () => abrirModalDetalhes(sonho);
                    
                    const percentagem = sonho.custo > 0 ? ((sonho.valor_guardado / sonho.custo) * 100).toFixed(0) : 0;

                    card.innerHTML = `
                        <div class="flex items-center gap-4">
                            <!-- Ícone Categoria -->
                            <div class="w-12 h-12 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-xl shadow-inner">
                                ${opcoesChips.categoria.find(c => c.val === sonho.categoria)?.icon || '📌'}
                            </div>
                            <div>
                                <h4 class="font-extrabold text-slate-800 leading-tight">${sonho.nome}</h4>
                                <div class="flex gap-2 mt-1.5">
                                    <span class="text-[9px] font-black uppercase px-2 py-0.5 rounded-md ${corPrio}">${sonho.prioridade}</span>
                                    <span class="text-[9px] font-black uppercase px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 border border-slate-200">${sonho.complexidade}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-black text-slate-800">${formatarMoeda(sonho.custo)}</p>
                            <p class="text-[10px] font-bold text-slate-400">${percentagem}% Concluído</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            document.getElementById('saldos-total-geral').innerHTML = `<span class="text-xl">R$</span>${totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits:2})}`;
            document.getElementById('saldos-guardado').innerText = formatarMoeda(totalGuardado);
            document.getElementById('saldos-falta').innerText = formatarMoeda(totalGeral - totalGuardado);
        }

        // ========================================================
        // 5. MODAL BOTTOM SHEET (Detalhes)
        // ========================================================
        const modal = document.getElementById('modal-detalhes');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');

        function abrirModalDetalhes(sonho) {
            modal.classList.remove('hidden');
            // Pequeno delay para a transição do CSS aplicar
            setTimeout(() => {
                modalBackdrop.classList.add('opacity-100');
                modalContent.classList.remove('bottom-sheet-down');
                modalContent.classList.add('bottom-sheet-up');
            }, 10);

            let HTMLPartes = '';
            if(sonho.complexidade === 'Composto' && sonho.itens_compostos) {
                HTMLPartes = `<div class="mt-5">
                    <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-2">Sub-itens (${sonho.itens_compostos.length})</p>
                    <div class="space-y-2">
                        ${sonho.itens_compostos.map(p => `
                            <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                <span class="text-sm font-bold text-slate-700">${p.nome}</span>
                                <span class="text-xs font-black text-slate-900">${formatarMoeda(p.custo)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            document.getElementById('modal-body').innerHTML = `
                <div class="text-center mb-6">
                    <div class="w-16 h-16 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-3xl mx-auto mb-3 shadow-sm">
                        ${opcoesChips.categoria.find(c => c.val === sonho.categoria)?.icon || '📌'}
                    </div>
                    <h2 class="text-2xl font-black text-slate-900">${sonho.nome}</h2>
                    <p class="text-xs font-bold text-slate-400 mt-1">${sonho.categoria} • ${sonho.quantidade} unidade(s)</p>
                </div>

                <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 flex justify-between items-center mb-5">
                    <div>
                        <p class="text-[10px] font-extrabold text-indigo-400 uppercase">Custo Total</p>
                        <p class="text-xl font-black text-indigo-700">${formatarMoeda(sonho.custo)}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-extrabold text-indigo-400 uppercase">Falta Poupar</p>
                        <p class="text-lg font-black text-indigo-500">${formatarMoeda(sonho.custo - sonho.valor_guardado)}</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-5">
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <p class="text-[10px] font-extrabold text-slate-400 uppercase">Prioridade</p>
                        <p class="text-sm font-bold text-slate-700">${sonho.prioridade}</p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <p class="text-[10px] font-extrabold text-slate-400 uppercase">Execução</p>
                        <p class="text-sm font-bold text-slate-700">${sonho.viabilidade}</p>
                    </div>
                </div>

                ${HTMLPartes}

                <div class="mt-6">
                    <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-2">Observações / Análise</p>
                    <textarea placeholder="Escreve aqui notas, lojas, links..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 min-h-[100px] resize-none"></textarea>
                </div>
            `;
        }

        function fecharModal() {
            modalBackdrop.classList.remove('opacity-100');
            modalContent.classList.remove('bottom-sheet-up');
            modalContent.classList.add('bottom-sheet-down');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

    </script>
</body>
</html>
