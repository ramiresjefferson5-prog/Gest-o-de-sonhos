<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Sonhos - Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <!-- Barra de Navegação no topo -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-slate-800">Meus Sonhos & Gastos</h1>
        
        <!-- Botão de Sair -->
        <button id="btn-sair" class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors">
            Sair da Conta
        </button>
    </nav>

    <!-- Área principal onde vamos construir o sistema depois -->
    <main class="p-8 max-w-4xl mx-auto hidden" id="conteudo-principal">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Bem-vindo ao teu centro de controlo!</h2>
            <p class="text-slate-600">O login funcionou perfeitamente. Em breve, vamos colocar aqui a lista do que precisas e o balanço do teu orçamento vs. os teus sonhos.</p>
        </div>
    </main>

    <script>
        // Precisamos sempre das chaves para falar com o cofre, mesmo nesta página!
        const URL_DO_TEU_SUPABASE = 'https://lqfwpfaqcnfsybxchmtg.supabase.co';
        const CHAVE_DO_TEU_SUPABASE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxZndwZmFxY25mc3lieGNobXRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2ODk5MjIsImV4cCI6MjA5MDI2NTkyMn0.XMO-YQIzULWK2yMFoqdBVP-wYPA7P84sp4QnsuS0hks';

        const clienteSupabase = window.supabase.createClient(URL_DO_TEU_SUPABASE, CHAVE_DO_TEU_SUPABASE);

        // Função para lidar com o redirecionamento de forma segura
        function irParaLogin() {
            try {
                // Tenta redirecionar para a página inicial (funciona no GitHub e no teu computador)
                window.location.href = 'index.html';
            } catch (erro) {
                // Se falhar (ex: no ambiente de pré-visualização onde as hiperligações são bloqueadas),
                // substituímos o ecrã por uma mensagem amigável de erro.
                document.body.innerHTML = `
                    <div class="h-screen flex items-center justify-center bg-slate-50 font-sans p-4">
                        <div class="bg-white p-8 rounded-xl shadow-lg text-center max-w-sm w-full border border-slate-200">
                            <h2 class="text-xl font-bold text-red-600 mb-3">Acesso Necessário</h2>
                            <p class="text-slate-600 mb-2">Não tens sessão iniciada ou terminaste a sessão.</p>
                            <p class="text-slate-500 text-sm">Por favor, abre o ficheiro <strong>index.html</strong> no teu computador para fazeres o login.</p>
                        </div>
                    </div>
                `;
            }
        }

        // Função crucial: Verificar se o utilizador está MESMO logado.
        async function protegerPagina() {
            const { data: { session } } = await clienteSupabase.auth.getSession();
            
            if (!session) {
                // Não tem sessão? Volta para a página de login!
                irParaLogin();
            } else {
                // Tem sessão? Mostra o conteúdo da página
                document.getElementById('conteudo-principal').classList.remove('hidden');
            }
        }

        // Dizer ao botão "Sair da Conta" o que fazer
        document.getElementById('btn-sair').addEventListener('click', async function() {
            await clienteSupabase.auth.signOut(); // Apaga a sessão
            irParaLogin(); // Volta para o início
        });

        // Corremos a proteção assim que a página abre
        protegerPagina();
    </script>
</body>
</html>
