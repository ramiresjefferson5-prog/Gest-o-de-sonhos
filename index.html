<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Sonhos - Login</title>
    
    <!-- Ferramenta para deixar a página bonita automaticamente (Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Ferramenta do Supabase para o nosso site conseguir falar com o "cofre" -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-sans">

    <!-- Caixa principal do Login por Email/Senha -->
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-sm w-full text-center">
        
        <!-- Ícone e Título -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Gestor de Sonhos</h1>
            <p class="text-slate-500 text-sm mt-2">Acede à tua conta ou regista-te.</p>
        </div>

        <!-- Formulário de Email e Senha -->
        <div class="space-y-4 text-left">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">O teu Email</label>
                <input type="email" id="email" placeholder="exemplo@email.com" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">A tua Senha</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <button id="btn-entrar" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 px-4 rounded-lg transition-colors mt-2">
                Entrar
            </button>
            <button id="btn-registar" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 border border-slate-200 rounded-lg transition-colors">
                Criar Nova Conta
            </button>
        </div>

        <!-- Mensagem de estado -->
        <p id="mensagem" class="mt-4 text-sm font-medium hidden"></p>
    </div>

    <!-- O nosso código lógico (O "cérebro" da página) -->
    <script>
        // PASSO 1: Ligar a página ao teu cofre do Supabase.
        const URL_DO_TEU_SUPABASE = 'https://lqfwpfaqcnfsybxchmtg.supabase.co';
        const CHAVE_DO_TEU_SUPABASE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxZndwZmFxY25mc3lieGNobXRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2ODk5MjIsImV4cCI6MjA5MDI2NTkyMn0.XMO-YQIzULWK2yMFoqdBVP-wYPA7P84sp4QnsuS0hks';

        const clienteSupabase = window.supabase.createClient(URL_DO_TEU_SUPABASE, CHAVE_DO_TEU_SUPABASE);

        // PASSO 2: Encontrar os elementos na página
        const btnEntrar = document.getElementById('btn-entrar');
        const btnRegistar = document.getElementById('btn-registar');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const mensagemTexto = document.getElementById('mensagem');

        function mostrarMensagem(texto, cor) {
            mensagemTexto.innerText = texto;
            // Remove as cores antigas e adiciona a nova
            mensagemTexto.className = `mt-4 text-sm font-medium text-${cor}-600`;
            mensagemTexto.classList.remove('hidden');
        }

        // AÇÃO: Criar Conta
        btnRegistar.addEventListener('click', async function() {
            const email = emailInput.value;
            const password = passwordInput.value;
            
            if(!email || !password) {
                mostrarMensagem("Por favor, preenche o email e a senha.", "red");
                return;
            }
            
            btnRegistar.innerText = "A registar...";
            
            // O Supabase tenta criar o utilizador no cofre
            const { data, error } = await clienteSupabase.auth.signUp({
                email: email,
                password: password,
            });

            if (error) {
                mostrarMensagem(error.message, "red");
            } else {
                mostrarMensagem("Conta criada com sucesso! Já podes clicar em Entrar.", "green");
            }
            btnRegistar.innerText = "Criar Nova Conta";
        });

        // AÇÃO: Entrar (Login)
        btnEntrar.addEventListener('click', async function() {
            const email = emailInput.value;
            const password = passwordInput.value;
            
            if(!email || !password) {
                mostrarMensagem("Por favor, preenche o email e a senha.", "red");
                return;
            }

            btnEntrar.innerText = "A verificar...";
            
            // O Supabase verifica se a senha bate certo
            const { data, error } = await clienteSupabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                mostrarMensagem("Erro ao entrar. Verifica o email e a senha.", "red");
                btnEntrar.innerText = "Entrar";
            } else {
                // Se tudo estiver bem, vai para o Painel!
                window.location.href = 'dashboard.html';
            }
        });

        // VERIFICAÇÃO: Se já tem sessão, envia para a subpágina
        async function verificarSessao() {
            const { data: { session } } = await clienteSupabase.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        }

        verificarSessao();
    </script>
</body>
</html>
